<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="d-flex flex-column align-items-center justify-content-center">
    <div id="particles-js"></div>
    <div class="container text-center my-4">
      <h1 class="mb-4 dashboard-title">🌦️ Weather Dashboard</h1>

      <!-- Search Bar -->
      <div class="search-bar-container mb-4 w-75 mx-auto d-flex align-items-center justify-content-center flex-wrap">
        <div class="input-group rounded-pill shadow-lg overflow-hidden">
          <input
            type="text"
            id="city"
            class="form-control border-0 px-4 py-2"
            placeholder="Enter city name"
            style="border-radius: 50px 0 0 50px;"
          />
          <button class="btn btn-primary px-4" onclick="getWeather()" style="border-radius: 0 50px 50px 0;">
            <i class="fas fa-search"></i>
          </button>
        </div>
        <button id="toggleDark" class="btn btn-dark ms-3 mt-2 mt-md-0 rounded-circle p-2" title="Toggle Dark Mode">
          🌙
        </button>
      </div>
      

      <!-- Weather Cards Section -->
      <div id="weather-section" class="row justify-content-center hidden">
        <!-- Current Weather Card -->
        <div class="card glass-card col-md-5 m-3 p-4">
          <div class="d-flex flex-column align-items-center">
            <img id="weather-icon" src="" alt="Weather Icon" width="100" />
            <h2 id="city-name" class="mt-2"></h2>
            <h4 id="date"></h4>
            <h1 id="temperature" class="mt-3"></h1>
            <p id="weather-desc" class="lead"></p>
            <p id="humidity"></p>
            <p id="wind"></p>
          </div>
        </div>

        <!-- 5-Day Forecast Card -->
        <div class="card glass-card col-md-5 m-3 p-4">
          <h3>Upcoming Weather 🔮</h3>
          <div id="forecast" class="mt-4 d-flex flex-column gap-3">
            <!-- Forecast cards will come here -->
          </div>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <footer class="footer-glass">
      <div class="footer-content">
        <p>&copy; 2025 WeatherPro. All rights reserved.</p>
        <p>Made By rajeev</p>
      </div>
    </footer>
    


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
    <!-- Particles.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  </body>
</html>
